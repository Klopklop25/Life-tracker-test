<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<!-- de app vertaalt zelf (NL/EN); browservertaling zou Magic-termen verhaspelen ("Back" werd "Rug") -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Commander Life Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap">
<style>
/* Speeltafel: tegels rondom het tablet, bovenste rij 180° gedraaid naar de spelers aan de overkant. Donker als basis, licht via thema of systeem. Rechte hoeken. */
:root{
  color-scheme:dark;
  --bg:#121118; --fg:#f5f2ea; --muted:#a39db0; --line:#2e2a3a; --panel:#1d1a26; --panel2:#282435;
  --danger:#ff5544; --warn:#ffbf2e; --accent:#ffb627; --ig:#3ddc6e; --ir:#ff4b3e; --iy:#ffcc1f;
  --f-num:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#efece6;--fg:#17151d;--muted:#655f70;--line:#d6d0c6;--panel:#fbfaf7;--panel2:#e6e1d8;--danger:#e3341f;--warn:#c88a00;--accent:#d98c00;--ig:#11943f;--ir:#dc2f1e;--iy:#c99100}}
:root[data-theme="light"]{color-scheme:light;--bg:#efece6;--fg:#17151d;--muted:#655f70;--line:#d6d0c6;--panel:#fbfaf7;--panel2:#e6e1d8;--danger:#e3341f;--warn:#c88a00;--accent:#d98c00;--ig:#11943f;--ir:#dc2f1e;--iy:#c99100}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
input{user-select:text;-webkit-user-select:text}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#board{--bh:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));--bs:clamp(32px,calc(var(--bh)/13),52px);height:100%;display:grid;grid-template-rows:1fr auto 1fr;gap:6px 10px}
/* staand scherm (telefoon): het hele speelveld een kwartslag draaien, zodat de liggende indeling blijft */
@media (orientation:portrait){#board{--bh:calc(100dvw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  position:fixed;left:50%;top:50%;width:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:var(--bh);transform:translate(-50%,-50%) rotate(90deg)}
  #board.two{--bh:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));position:relative;left:auto;top:auto;width:auto;height:100%;transform:none}
}
/* 2 spelers: staande indeling (twee bijna vierkante vakken boven elkaar); op een liggend scherm draait het speelveld daarvoor een kwartslag.
   De balk is dan zo breed als de korte schermzijde: kleinere knoppen en zo nodig twee regels */
#board.two .bar{flex-wrap:wrap;gap:4px;padding-block:2px}
#board.two .bar button{min-height:40px;padding:0 8px;gap:5px}
#board.two .bar .ic{width:40px;padding:0}
#board.two .bar svg{width:20px;height:20px}
#board.two .bar button b{font-size:20px}
@media (orientation:landscape){#board.two{--bh:calc(100dvw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  position:fixed;left:50%;top:50%;width:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:var(--bh);transform:translate(-50%,-50%) rotate(90deg)}}
/* one-sided view omgedraaid: vakken blijven op hun plek, alleen de inhoud en de menubalk kijken naar de andere kant */
.bar.flip{transform:rotate(180deg)}
.bar{grid-column:1/-1;grid-row:2;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;pointer-events:none}
.bar button{pointer-events:auto;box-shadow:0 0 0 5px var(--bg);flex:none;min-height:44px;padding:0 14px;background:var(--panel2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bar button b{font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:0}
.bar button:active{background:var(--line)}
.bar button.sure{background:var(--danger);color:#1a0d0b}
.bar .ic{padding:0;width:52px;justify-content:center}
.bar svg{width:24px;height:24px}
#pop{position:fixed;z-index:15;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 32px rgb(0 0 0/.55);transform:translate(-50%,-50%)}
#pop button{min-width:58px;min-height:54px;background:var(--panel2);font-family:var(--f-num);font-weight:700;font-size:28px}
#pop button.on{background:var(--accent);color:var(--bg)}
.opts svg{width:28px;height:28px}
.opts{display:flex;gap:6px}
.roll{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 4px}
.die{width:96px;height:96px;perspective:420px}
.die.dn{transform:rotate(180deg)}
.dw{position:relative;width:100%;height:100%;display:grid;place-items:center}
.dw svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--panel2);stroke:var(--muted);stroke-width:3;stroke-linejoin:round}
.dw svg .ln{fill:none;opacity:.45}
.dw b{position:relative;transform:translateY(var(--ty,0));font-family:var(--f-num);font-weight:900;font-size:38px;line-height:1;opacity:.55;font-variant-numeric:tabular-nums}
.dw.munt b{font-size:24px}
.die.fin svg{stroke:var(--accent)}.die.fin b{opacity:1;color:var(--accent)}
.dw.go{animation:tumble 1.15s cubic-bezier(.2,.7,.3,1)}
.dw.flip{animation:flip 1.15s cubic-bezier(.3,.6,.4,1)}
@keyframes tumble{0%{transform:translate(-46px,-26px) rotate(-260deg) scale(.55)}25%{transform:translate(-14px,10px) rotate(-90deg) scale(1)}45%{transform:translate(6px,-10px) rotate(25deg)}65%{transform:translate(-2px,3px) rotate(-10deg)}82%{transform:translate(1px,-1px) rotate(3deg)}100%{transform:none}}
@keyframes flip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-34px) rotateY(900deg) scale(1.1)}80%{transform:translateY(2px) rotateY(1340deg)}100%{transform:translateY(0) rotateY(1440deg)}}
@media (prefers-reduced-motion:reduce){.dw{animation:none!important}}
.mana{position:relative;display:grid;gap:6px;padding:2px 4px}
#pop.r180{transform:translate(-50%,-50%) rotate(180deg)}
#pop .mana .turn{position:absolute;top:-2px;right:-2px;min-width:0;min-height:0;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.mana .turn svg{width:22px;height:22px}
.mana h3{margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#pop .mana h3 button{min-width:0;min-height:0;width:36px;height:36px;background:none;color:var(--muted);display:grid;place-items:center}
.mana h3 svg{width:18px;height:18px}
.mrow{display:grid;grid-template-columns:48px 56px 64px 48px;align-items:center;justify-items:center;gap:10px}
#pop .mrow button{min-width:0;min-height:0;width:48px;height:48px;font-size:28px;line-height:1}
.mi{width:52px;height:52px;display:block;transition:opacity .2s}
.mi svg{display:block;width:100%;height:100%}
.mrow b{font-family:var(--f-num);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;transition:opacity .2s}
.mrow.zero .mi{opacity:.3}.mrow.zero b{opacity:.35}
.roll span{color:var(--muted);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}

.tile{position:relative;container-type:size;overflow:hidden;background:var(--c);color:var(--t);min-width:0;min-height:0;transition:filter .3s}
.inner{position:absolute;inset:0;container-type:size}
.inner.rot{transform:rotate(180deg)}
.inner.side{inset:auto;left:50%;top:50%;width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(-90deg)}
.art{position:absolute;inset:0;background:center/cover no-repeat;pointer-events:none}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(0 0 0/.3),rgb(0 0 0/.15) 40%,rgb(0 0 0/.55))}
.tile.has-art .life,.tile.has-art .name,.tile.has-art .delta{text-shadow:0 2px 14px rgb(0 0 0/.7)}
.credit{position:absolute;right:12px;bottom:8px;max-width:30%;font-size:10px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.zone{position:absolute;top:0;bottom:0;width:50%;transition:background .12s}
.zone[data-z="-1"]{left:0}.zone[data-z="1"]{right:0}
.zone.press{background:rgb(0 0 0/.14)}
.sign{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-weight:700;font-size:min(16cqh,11cqw);opacity:.35;pointer-events:none}
.sign.m{left:6cqw}.sign.p{right:6cqw}
.name{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:600;font-size:clamp(13px,6cqh,20px);letter-spacing:.06em;text-transform:uppercase;opacity:.8;pointer-events:none;padding-inline:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.life{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:min(52cqh,34cqw);line-height:1;font-variant-numeric:tabular-nums;pointer-events:none}
.delta{position:absolute;left:0;right:0;top:calc(50% - min(34cqh,22cqw));text-align:center;font-family:var(--f-num);font-weight:700;font-size:min(13cqh,8cqw);pointer-events:none;opacity:0;transition:opacity .25s}
.delta.on{opacity:.85}
/* spelertellers (poison = gifdruppel, rad = stralingssymbool): … rechtsboven, actieve tellers linksboven */
.more{position:absolute;top:6px;right:8px;z-index:2;width:44px;height:40px;display:grid;place-items:center;color:inherit;opacity:.75}
.more svg{width:24px;height:24px}
/* tellers schalen mee met het vak, zodat ze op een telefoon klein blijven en naast elkaar passen */
.ctrs{--ch:clamp(26px,12cqh,40px);position:absolute;top:8px;left:8px;z-index:2;max-width:46%;display:flex;flex-wrap:wrap;gap:4px}
.ctr{position:relative;height:var(--ch);padding:0 calc(var(--ch)*.22) 0 3px;display:flex;align-items:center;gap:4px;background:rgb(0 0 0/.3);color:#fff}
.ctr svg{width:calc(var(--ch)*.75);height:calc(var(--ch)*.75);flex:none}
.ctr b{font-family:var(--f-num);font-weight:900;font-size:calc(var(--ch)*.6);min-width:1ch;text-align:center;font-variant-numeric:tabular-nums}
.ctr button{position:absolute;top:0;bottom:0;width:50%}
.ctr button:first-of-type{left:0}.ctr button:last-of-type{right:0}
.ctr button:active{background:rgb(0 0 0/.25)}
.ctr.d{outline:3px solid var(--danger);outline-offset:-3px}
.ctr.flag{padding:0 4px;pointer-events:none}
.cpanel{z-index:6}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;overflow:auto;align-content:start}
.copt{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 10px 4px 6px;background:var(--panel2);text-align:left;font-size:15px;opacity:.6}
.copt svg{width:32px;height:32px;flex:none}
.copt.on{opacity:1;box-shadow:inset 0 0 0 2px var(--accent)}
.opps{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:clamp(4px,1.5cqw,8px);padding-inline:8px}
.chip{position:relative;width:clamp(52px,18cqw,96px);height:clamp(44px,17cqh,64px);background:var(--c) center/cover;outline:2px solid rgb(0 0 0/.25);outline-offset:-2px;display:grid;place-items:center;flex:none}
.chip::before{content:"−      +";position:absolute;inset:auto 0 1px;text-align:center;font-size:11px;font-weight:600;color:#fff;opacity:.75;white-space:pre;text-shadow:0 1px 3px rgb(0 0 0/.9);pointer-events:none}
.chip b{position:relative;z-index:1;font-family:var(--f-num);font-weight:900;font-size:clamp(20px,6cqh,28px);color:#fff;text-shadow:0 1px 6px rgb(0 0 0/.9);pointer-events:none;margin-top:-6px}
.chip button{position:absolute;top:0;bottom:0;width:50%}
.chip button:first-of-type{left:0}.chip button:last-of-type{right:0}
.chip button:active{background:rgb(0 0 0/.25)}
.chip.w{outline:3px solid var(--warn);outline-offset:-3px}.chip.d{outline:3px solid var(--danger);outline-offset:-3px}
.cmdbtn{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 16px;background:rgb(0 0 0/.22);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.cmdbtn svg{width:20px;height:20px}
.cmdbtn.hot{background:var(--danger);color:#1a0d0b}
.out{position:absolute;top:calc(50% + min(28cqh,18cqw));left:0;right:0;text-align:center;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;pointer-events:none;display:none}
.tile.dead{filter:grayscale(.85) brightness(.55)}
.tile.dead .out{display:block}
/* markering wie begint: als laag bovenop, zodat hij ook over gekozen art heen zichtbaar is */
.tile.pick::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border:6px solid var(--accent);box-shadow:inset 0 0 0 2px #000,inset 0 0 40px rgb(255 182 39/.55)}
.start{position:absolute;z-index:5;top:max(40px,calc(50% - min(26cqh,17cqw) - 34px));left:50%;transform:translateX(-50%);padding:6px 18px;background:var(--accent);color:#17151d;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px rgb(0 0 0/.5);pointer-events:none;display:none}
.tile.first .start{display:block}
/* beurtvolgorde: actieve speler krijgt een gouden kader en een brede End turn-strook onderin (draait mee met de speler) */
.tile.turn::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border:6px solid var(--accent);animation:turnglow 1.6s ease-in-out infinite}
@keyframes turnglow{0%,100%{box-shadow:inset 0 0 0 2px #000,inset 0 0 24px rgb(255 182 39/.35)}50%{box-shadow:inset 0 0 0 2px #000,inset 0 0 70px rgb(255 182 39/.75)}}
.inner{--sh:clamp(44px,16cqh,76px)}
.endturn{position:absolute;left:6px;right:6px;bottom:6px;z-index:4;height:var(--sh);display:flex;align-items:center;justify-content:center;gap:14px;
  background:var(--accent);color:#17151d;font-weight:700;font-size:clamp(17px,5cqh,24px);letter-spacing:.1em;text-transform:uppercase;animation:endpulse 1.6s ease-in-out infinite}
.endturn svg{width:1.2em;height:1.2em}
.endturn:active{filter:brightness(.85)}
@keyframes endpulse{0%,100%{box-shadow:0 0 0 0 rgb(255 182 39/.0)}50%{box-shadow:0 0 22px 4px rgb(255 182 39/.65)}}
/* in de beurt: getal in de ruimte boven de strook; het schildje links naast de strook; tegenstanderblokjes erboven */
.tile.turn .life{top:clamp(22px,9cqh,44px);bottom:calc(var(--sh) + 6px);font-size:min(38cqh,30cqw)}
.tile.turn .cmdbtn{left:6px;bottom:6px;transform:none;height:var(--sh);width:var(--sh);min-height:0;padding:0;justify-content:center;flex-direction:column;gap:0;z-index:5;background:rgb(0 0 0/.35);color:#fff}
.tile.turn:has(.cmdbtn) .endturn{left:calc(var(--sh) + 12px)}
.tile.turn .opps{bottom:calc(var(--sh) + 14px)}
.tile.turn .out{display:none}
@media (prefers-reduced-motion:reduce){.tile.turn::before,.endturn{animation:none}}
.bar .tturn{background:var(--accent);color:#17151d}
.bar .tturn b{color:#17151d}
/* geschiedenis */
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hhead h2{margin:0}
.hsub{display:block;margin-top:4px;color:var(--muted);font-size:15px}
.hundo{min-height:44px;padding:0 16px;background:var(--panel2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.hundo svg{width:20px;height:20px}
.hlist{display:grid;gap:6px;max-height:58dvh;overflow-y:auto;align-content:start}
.hround{padding:8px 0 2px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hturn{background:var(--panel2);padding:10px 14px;display:grid;gap:6px}
.hturn.now{box-shadow:inset 3px 0 0 var(--accent)}
.hwho{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hturn.now .hwho span{color:var(--fg)}
.hwho em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;font-size:15px}
.hturn.now .hwho em{color:var(--accent)}
.hrow{display:grid;grid-template-columns:14px minmax(0,1fr) 56px 96px;align-items:center;gap:10px;font-size:17px}
.hrow small{color:var(--muted);font-size:14px}
.hrow>small{text-align:right}
.hrow b{font-family:var(--f-num);font-size:24px;text-align:right}
.hrow b.neg{color:var(--danger)}.hrow b.pos{color:var(--ig)}
.hdot{width:14px;height:14px;background:var(--c);outline:1px solid rgb(127 127 127/.4)}

/* commandant-schade */
.cmd{position:absolute;inset:0;background:var(--panel);color:var(--fg);display:flex;flex-direction:column;padding:10px 12px;gap:6px}
.cmd header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.cmd header button{min-width:44px;min-height:44px;font-size:26px;line-height:1;color:var(--fg)}
.rows{display:grid;gap:6px;overflow:auto;align-content:start}
.row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;background:var(--panel2);padding:4px 4px 4px 12px}
.row .who{display:flex;align-items:center;gap:8px;min-width:0;font-size:17px}
.row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:14px;height:14px;background:var(--c);box-shadow:0 0 0 1px rgb(255 255 255/.25)}
.row button{width:52px;height:48px;background:var(--line);font-family:var(--f-num);font-weight:700;font-size:28px}
.row button:active{background:var(--muted);color:var(--bg)}
.row b{min-width:48px;text-align:center;font-family:var(--f-num);font-size:32px;font-variant-numeric:tabular-nums}
.row b.w{color:var(--warn)}.row b.d{color:var(--danger)}


/* instellingen */
#sheet{position:fixed;inset:0;z-index:20;background:rgb(10 9 14/.72);display:grid;place-items:center;padding:16px}
.box{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:20px;display:grid;gap:18px}
.box h2{margin:0;font-family:var(--f-num);font-weight:900;font-size:30px;letter-spacing:.02em}
.grp{display:grid;gap:8px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:56px;min-height:48px;background:var(--panel2);font-family:var(--f-num);font-weight:700;font-size:24px;padding-inline:14px}
.seg button.on{background:var(--accent);color:var(--bg)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:17px;text-align:left}
.tog small{display:block;font-size:13px;color:var(--muted)}
.tog>svg{flex:none;width:26px;height:26px;color:var(--muted)}
/* apparaten koppelen */
.lmsg{margin:0;color:var(--muted);font-size:16px;line-height:1.45;max-width:60ch}
.qr{align-self:center;justify-self:center;width:min(320px,70vw,52dvh);aspect-ratio:1;background:#fff;padding:6px}
.qr svg{display:block;width:100%;height:100%}
.lalt summary{cursor:pointer;color:var(--muted);font-size:15px;min-height:32px}
.lalt textarea,.lpaste textarea{width:100%;box-sizing:border-box;margin:8px 0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);font:13px/1.4 ui-monospace,Consolas,monospace;padding:8px;word-break:break-all;resize:vertical}
.lalt button,.lpaste button{min-height:44px;padding:0 16px;background:var(--panel2);font-weight:600}
.lvid{width:100%;max-height:44dvh;background:#000;object-fit:cover}
.bar button.linked{color:var(--ig)}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 18px;background:var(--fg);color:var(--bg);font-weight:600;font-size:16px;box-shadow:0 8px 24px rgb(0 0 0/.4);pointer-events:none}
.sw{flex:none;width:58px;height:34px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;background:var(--fg);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(24px);background:var(--bg)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
@media (max-width:560px){.pl{grid-template-columns:minmax(0,1fr) auto}.pl .cols{grid-column:1/-1;order:3}}
.artbtn{width:64px;height:44px;background:var(--panel2) center/cover;display:grid;place-items:center;color:var(--muted)}
.artbtn svg{width:22px;height:22px}
.box.wide{width:min(920px,100%)}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:18px;padding:0 14px}
.srch button{min-height:48px;padding:0 20px;background:var(--accent);color:var(--bg);font-weight:600;font-size:17px}
/* zoekresultaten: vaste maat per afbeelding, de lijst scrollt (niet samenpersen) */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));grid-auto-rows:max-content;gap:12px;max-height:60dvh;overflow-y:auto;overscroll-behavior:contain;align-content:start;padding-right:4px}
.res button{display:grid;gap:6px;text-align:left;padding:0 0 8px;background:var(--panel2);overflow:hidden;min-height:max-content}
.res img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.res small{padding:0 10px;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .on{box-shadow:inset 0 0 0 3px var(--accent)}
.msg{grid-column:1/-1;margin:8px 0;color:var(--muted);font-size:16px}
.pl input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:17px;padding:0 12px}
.pname{display:flex;min-width:0}
.pname input{flex:1;min-width:0;border-right:0}
.pbtn{flex:none;width:44px;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-left:0;display:grid;place-items:center;color:var(--muted);font-size:24px;line-height:1}
.pbtn svg{width:20px;height:20px}
.pbtn.ok{color:var(--ig)}
.profs{display:grid;gap:6px;max-height:55dvh;overflow-y:auto;align-content:start}
.prof{display:flex}
.puse{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 12px 0 6px;background:var(--panel2);text-align:left;font-size:18px}
.puse span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .pbtn{width:56px;border:0;margin-left:2px}
.pthumb{flex:none;width:64px;height:44px;background:var(--c) center/cover}
.cols{display:flex;gap:4px}
.cols button{width:32px;height:44px;background:var(--c);opacity:.45}
.cols button.on{opacity:1;box-shadow:inset 0 0 0 3px var(--fg)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{flex:1 1 140px;min-height:52px;background:var(--panel2);font-weight:600;font-size:17px}
.acts .new{background:var(--accent);color:var(--bg)}
.acts .new.sure{background:var(--danger)}

/* verticale menubalk naast de hoofdplek, gedraaid naar die speler */
.bar.vert{grid-column:-3/-2;grid-row:1/4;flex-direction:column-reverse;gap:min(8px,calc(var(--bh)/90))}
.bar.vert button{writing-mode:vertical-rl;transform:rotate(180deg);width:var(--bs);min-height:0;padding:calc(var(--bs)*.2) 0;justify-content:center;gap:4px}
.bar.vert .ic{height:var(--bs)}
.bar.vert svg{transform:rotate(90deg);width:calc(var(--bs)*.46);height:calc(var(--bs)*.46)}
.bar.vert button b{font-size:calc(var(--bs)*.46)}
/* one-sided view: verticale balk rechtop, van boven naar beneden */
.bar.vert.up{flex-direction:column}
.bar.vert.up button{writing-mode:horizontal-tb;transform:none;flex-direction:column;padding:calc(var(--bs)*.14) 0}
.bar.vert.up svg{transform:none}
.bar button.on{color:var(--accent)}
.bar svg.ig{color:var(--ig)}.bar svg.ir{color:var(--ir)}.bar svg.iy{color:var(--iy)}
.name{pointer-events:auto;cursor:text;margin-inline:auto;width:fit-content;max-width:100%;padding-block:4px}
.namein{width:min(320px,90cqw);min-height:40px;border:2px solid var(--accent);background:var(--panel);color:var(--fg);font:inherit;font-size:18px;text-align:center;text-transform:none;letter-spacing:0;padding:0 10px}
.custom{display:flex;gap:6px}
.custom input{flex:1;min-width:0;width:120px;min-height:54px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-family:var(--f-num);font-weight:700;font-size:28px;padding:0 12px}
#pop .custom button{font-family:var(--f-ui);font-weight:600;font-size:18px;padding:0 18px;background:var(--accent);color:var(--bg)}
/* planechase */
.plane{background:var(--panel);color:var(--fg)}
.pimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pimg img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.pimg p{margin:0;padding:12px;text-align:center;color:var(--muted);font-size:16px}
.pimg p button{display:block;margin:10px auto 0;min-height:44px;padding:0 16px;background:var(--accent);color:var(--bg);font-weight:600}
/* de kaart ligt een kwartslag gedraaid in het vak: zijn rechterbovenhoek is linksboven in het vak */
.pbar{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pdie{width:48px;height:48px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 2px 10px rgb(0 0 0/.4);transform:rotate(-90deg)}
.pdie .face{display:grid;place-items:center;width:28px;height:28px}
.pdie .face svg{max-width:28px;max-height:28px;width:100%;height:100%}
.pdie .face.go{animation:tumble .95s cubic-bezier(.2,.7,.3,1)}
.pdie.r-pw{border-color:var(--accent);color:var(--accent)}.pdie.r-chaos{border-color:var(--danger);color:var(--danger)}
.pcost{width:40px;padding:10px 0;background:var(--panel2);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;color:var(--muted);box-shadow:0 2px 10px rgb(0 0 0/.4)}
.pcost>*{transform:rotate(-90deg)}
#proll{position:fixed;inset:0;z-index:25;background:rgb(0 0 0/.6);display:grid;place-content:center;justify-items:center;gap:18px;cursor:pointer}
.bigdie{width:min(200px,40vmin);height:min(200px,40vmin);background:var(--panel);border:4px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 16px 48px rgb(0 0 0/.5)}
.bigdie .face{display:grid;place-items:center;width:58%;height:58%}
.bigdie .face svg{width:100%;height:100%}
.bigdie .face.go{animation:tumble 1.2s cubic-bezier(.2,.7,.3,1)}
.bigdie.r-pw{border-color:var(--accent);color:var(--accent)}.bigdie.r-chaos{border-color:var(--danger);color:var(--danger)}
#proll .lbl{min-height:1.2em;font-family:var(--f-num);font-weight:900;font-size:min(44px,9vmin);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px rgb(0 0 0/.6)}
.pcost svg{width:16px;height:16px}.pcost b{font-family:var(--f-num);font-size:22px;color:var(--fg)}
.pcm{display:grid;gap:8px;min-width:280px;padding:4px}
#pop .pcm button{font-family:var(--f-ui);font-weight:600;font-size:17px;padding:0 14px}
#pop .pcm .tog{background:none;font-size:19px}
.pcrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box h2 small{font-family:var(--f-ui);font-size:15px;font-weight:600;color:var(--muted);margin-left:8px}
.plist{display:grid;gap:6px;max-height:55vh;overflow:auto;align-content:start}
.pset{background:var(--panel2)}
.pshead{display:flex;align-items:center;gap:12px;padding:0 8px 0 14px}
.pshead input{flex:none;width:24px;height:24px;accent-color:var(--accent)}
.psname{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left}
.psname span{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psname small{font-size:14px;color:var(--muted);white-space:nowrap}
.psname svg{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .2s}
.psname.open svg{transform:rotate(180deg)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 10px;padding:0 10px 10px}
.prow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;padding:6px 8px;background:var(--panel);cursor:pointer}
.prow input{width:22px;height:22px;grid-row:span 2;accent-color:var(--accent)}
.prow span{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:12px;color:var(--muted)}
/* vergrote kaart: altijd midden in beeld en passend; liggend scherm 90°, staand 180° (zelfde stand als het gedraaide speelveld), knop draait nog 180° */
#zoom{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.88);cursor:zoom-out;overflow:hidden}
#zoom img{position:absolute;left:50%;top:50%;width:min(92dvh,66vw);transform:translate(-50%,-50%) rotate(calc(var(--zb,90deg) + var(--zf,0deg)))}
@media (orientation:portrait){#zoom img{--zb:180deg;width:min(92vw,66dvh)}}
#zoom.flip img{--zf:180deg}
#zoom .zturn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:1;width:56px;height:56px;background:var(--panel);color:var(--fg);display:grid;place-items:center;box-shadow:0 4px 16px rgb(0 0 0/.5)}
#zoom .zturn svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* tegenstanderblokjes passen niet bij 5-6 spelers op een klein scherm (telefoon): dan altijd het schildje met popup */

/* ==== Acties ==== */
function bump(i,d){pend[i]+=d;clearTimeout(pendT[i]);pendT[i]=setTimeout(()=>{pend[i]=0;update(i)},1600)}
/* gekoppeld als gast: de actie direct lokaal tonen én naar de host sturen; de host stuurt daarna de echte stand terug */
function life(i,d){toHost({a:'life',i,d});logLife(i,d);S.players[i].life+=d;bump(i,d);update(i);save()}
function cmd(i,f,d){toHost({a:'cmd',i,f,d});const p=S.players[i],nv=Math.max(0,p.cmd[f]+d),real=nv-p.cmd[f];if(!real)return;p.cmd[f]=nv;if(S.link){logLife(i,-real,f);p.life-=real;bump(i,-real)}update(i);save()}
function ctrChange(i,k,d){toHost({a:'cn',i,k,d});const t=COUNTERS.find(x=>x.k===k),p=S.players[i];if(!t||!p.cn||!(k in p.cn))return;p.cn[k]=Math.max(0,p.cn[k]+d*(t.step||1));save();update(i)}
function ctrToggle(i,k){toHost({a:'cntog',i,k});const t=COUNTERS.find(x=>x.k===k),p=S.players[i];if(!t)return;p.cn??={};
  if(k in p.cn)delete p.cn[k];else{p.cn[k]=t.flag?1:0;if(t.one)S.players.forEach((q,j)=>{if(j!==i&&q.cn&&k in q.cn){delete q.cn[k];update(j)}})}
  save();update(i)}
function manaChange(m,d,clr){toHost({a:'mana',m,d,clr});if(clr==='mana')S.mana.fill(0);else if(clr==='storm')S.storm=0;else if(m==='s')S.storm=Math.max(0,S.storm+d);else if(S.mana[m]!=null)S.mana[m]=Math.max(0,S.mana[m]+d);
  save();if(!pop.hidden&&popKind==='mana')pop.innerHTML=manaHtml()}

/* ==== Beurtvolgorde ==== */
/* S.tt = {start, active, round, log:[{r,p,ev:[{t,from,to,src:[]}]}]}; bestaat zolang de partij loopt (nieuw spel wist hem) */
const SEATS={2:[0,1],3:[0,1,2],4:[0,1,3,2],5:[0,1,2,3,4],6:[0,1,2,5,4,3]};
const seats=()=>pcOn()?[...Array(S.n).keys()]:SEATS[S.n];
const tOn=()=>S.turnOn&&S.tt&&S.tt.active<S.n;
function startTurns(w){S.tt={start:w,active:w,round:1,log:[{r:1,p:w,ev:[]}]};save();render()}
function logLife(i,d,src){
  if(!tOn()||!d)return;const cur=S.tt.log[S.tt.log.length-1];let e=cur.ev.find(x=>x.t===i);
  if(!e){e={t:i,from:S.players[i].life,to:S.players[i].life,src:[]};cur.ev.push(e)}
  e.to+=d;if(src!=null&&!e.src.includes(src))e.src.push(src);
  if(e.to===e.from&&!e.src.length)cur.ev.splice(cur.ev.indexOf(e),1);
}
function endTurn(){
  toHost({a:'end'});if(!tOn())return;const st=seats(),tt=S.tt,pos=x=>(st.indexOf(x)-st.indexOf(tt.start)+st.length)%st.length;
  let k=st.indexOf(tt.active),nx=tt.active;
  for(let n=0;n<st.length;n++){k=(k+1)%st.length;nx=st[k];if(!isDead(S.players[nx]))break}
  if(pos(nx)<=pos(tt.active))tt.round++;
  tt.active=nx;tt.log.push({r:tt.round,p:nx,ev:[]});save();render();
}
function undoTurn(quiet){
  toHost({a:'undo'});const tt=S.tt;if(!tt||tt.log.length<2)return;const last=tt.log.pop(),prev=tt.log[tt.log.length-1];
  for(const e of last.ev){const o=prev.ev.find(x=>x.t===e.t);if(o){o.to=e.to;o.src=[...new Set([...o.src,...e.src])]}else prev.ev.push(e)}
  tt.active=prev.p;tt.round=prev.r;save();render();if(!quiet)showHistory();
}
function showHistory(){
  const tt=S.tt,nm=i=>esc(S.players[i].name),dot=i=>`<i class="hdot" style="--c:${COLORS[S.players[i].color].c}"></i>`;
  let h='',r=0;
  if(tt)tt.log.forEach((g,k)=>{
    if(g.r!==r){r=g.r;h+=`<div class="hround">${T('Turn {r}',{r})}</div>`}
    const now=k===tt.log.length-1;
    h+=`<div class="hturn${now?' now':''}"><div class="hwho"><span>${T("{n}'s turn",{n:nm(g.p)})}</span>${now?'<em>'+T('In progress')+'</em>':g.ev.length?'':'<em>'+T('No life changes')+'</em>'}</div>
      ${g.ev.map(e=>{const d=e.to-e.from;return `<div class="hrow">${dot(e.t)}<span>${nm(e.t)}${e.src.length?` <small>· ${T('commander damage from {n}',{n:e.src.map(nm).join(', ')})}</small>`:''}</span><b class="${d<0?'neg':'pos'}">${d>0?'+':d<0?'−':''}${Math.abs(d)}</b><small>${e.from} → ${e.to}</small></div>`}).join('')}</div>`});
  sheet.innerHTML=`<div class="box wide" role="dialog" aria-label="${T('Match history')}"><div class="hhead"><div><h2>${T('Match history')}</h2>
      <span class="hsub">${tt?T('Turn {r}',{r:tt.round})+' · '+T("{n}'s turn",{n:nm(tt.active)}):T('Tap the crown to choose who goes first.')}</span></div>
      ${tt&&tt.log.length>1?`<button class="hundo" data-undo>${ico('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>')}${T('Undo end turn')}</button>`:''}</div>
    <div class="hlist">${h}</div><div class="acts"><button class="new" data-close>${T('Done')}</button></div></div>`;
  sheet.hidden=false;const l=sheet.querySelector('.hlist');l.scrollTop=l.scrollHeight;
}

const holds=new Map();

/* ==== Naam wijzigen in het vak ==== */

  const inp=el.firstChild;inp.focus();inp.select();

pop.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

/* ==== Wie begint ==== */
let spin=null;
function pickFirst(){
  clearTimeout(spin);const w=Math.floor(Math.random()*S.n),steps=matchMedia('(prefers-reduced-motion: reduce)').matches?0:S.n*2+w;
  const mark=(i,f)=>board.querySelectorAll('.tile').forEach(t=>{t.classList.toggle('pick',+t.dataset.i===i);t.classList.toggle('first',f&&+t.dataset.i===i)});

    spin=k<steps?setTimeout(()=>step(k+1),60+k*k*1.2):setTimeout(()=>mark(-1,false),5000)})(steps?0:w);

sheet.addEventListener('click',e=>{
  if(e.target===sheet){sheet.hidden=true;return}
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if('link' in ds){S.link=!S.link;save();showMenu()}
  else if('cmdrow' in ds){S.cmdRow=!S.cmdRow;open.clear();save();render();showMenu()}
  else if('turnon' in ds){S.turnOn=!S.turnOn;save();render();showMenu()}
  else if('oneside' in ds){S.oneSide=!S.oneSide;save();render();showMenu()}
  else if('undo' in ds)undoTurn();
  else if(ds.themeSet){S.theme=ds.themeSet;save();applyTheme();showMenu()}
  else if(ds.langSet){LANG=ds.langSet==='nl'?'nl':'en';try{localStorage.setItem('lt-lang',LANG)}catch(e){}document.documentElement.lang=LANG;langNames();save();render();showMenu()}
  else if(ds.pall){const on=ds.pall==='1',ids=new Set(planeFilter().map(c=>c.id));S.pc.off=on?S.pc.off.filter(x=>!ids.has(x)):[...new Set([...S.pc.off,...ids])];save();listPlanes()}
  else if('pdone' in ds){sheet.hidden=true;render()}
  else if(ds.open){openSets.has(ds.open)?openSets.delete(ds.open):openSets.add(ds.open);listPlanes()}
  else if(ds.col){const[i,k]=ds.col.split(':').map(Number);S.players[i].color=k;save();render();showMenu()}
  else if('fs' in ds){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen({navigationUI:'hide'}))?.catch(()=>{})}
  else if('close' in ds)sheet.hidden=true;
  else if(ds.art)showArt(+ds.art);
  else if(ds.psave){const i=+ds.psave,p=S.players[i];saveProfile(p);b.innerHTML=ico('<path d="M5 12.5l4.5 4.5L19 7.5"/>');b.classList.add('ok')}
  else if(ds.pload)showProfiles(+ds.pload);
  else if(ds.puse){const p=S.players[artFor],q=loadProfiles()[+ds.puse];if(!q)return;p.name=q.name;p.color=q.color;if(okArt(q.art)){p.art=q.art;p.artist=q.artist;keepArt(q.art)}else{delete p.art;delete p.artist}save();render();showMenu()}
  else if(ds.pdel){const l=loadProfiles();l.splice(+ds.pdel,1);storeProfiles(l);showProfiles(artFor)}
  else if(ds.pick){const r=found[+ds.pick],p=S.players[artFor];if(!r)return;p.art=r.art;p.artist=r.artist;save();keepArt(r.art);render();showMenu()}
  else if('noart' in ds){const p=S.players[artFor];delete p.art;delete p.artist;save();render();showMenu()}
  else if('back' in ds)showMenu();
});

/* ==== Planechase ==== */
const PKEY='lt-planes-v3';let PL={cards:null,map:null,state:''},pRolling=false;
async function loadPlanes(){
  if(PL.cards||PL.state==='busy')return;
  /* test- en grapkaarten (Scryfall set_type 'funny', bijv. Black Lotus Unknown: MagicCon Chicago, Black Lotus Lounge) één keer standaard uit */
  const use=cards=>{PL.cards=cards;PL.map=new Map(cards.map(c=>[c.id,c]));PL.state='';
    if(!S.pc.defs){S.pc.off=[...new Set([...S.pc.off,...cards.filter(c=>c.fun).map(c=>c.id)])];S.pc.defs=1;S.pc.deck=[];save()}};
  try{const c=JSON.parse(localStorage.getItem(PKEY));if(c?.cards?.length&&Date.now()-c.t<30*864e5){use(c.cards);renderPlane();return}}catch(e){}
  PL.state='busy';renderPlane();
  try{
    let url='https://api.scryfall.com/cards/search?q=layout%3Aplanar&unique=cards&order=name';const out=[];
    while(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw r.status;const j=await r.json();
      for(const c of j.data){const img=okArt(c.image_uris?.large);if(img)out.push({id:c.id,name:c.name,set:(c.set||'').toUpperCase(),setName:c.set_name||'',ph:/Phenomenon/.test(c.type_line),fun:c.set_type==='funny',img})}
      url=j.has_more&&/^https:\/\/api\.scryfall\.com\//.test(j.next_page)?j.next_page:null;if(url)await new Promise(r=>setTimeout(r,120))}
    use(out);try{localStorage.setItem(PKEY,JSON.stringify({t:Date.now(),cards:out}))}catch(e){}
  }catch(e){PL.state='err'}
  renderPlane();if(!sheet.hidden&&$('#plist'))listPlanes();
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function curPlane(){
  if(!PL.cards)return null;const on=PL.cards.filter(c=>!S.pc.off.includes(c.id));if(!on.length)return null;
  const ids=new Set(on.map(c=>c.id)),d=S.pc.deck;
  if(!d.length||d.length!==on.length||d.some(x=>!ids.has(x))){S.pc.deck=shuffle(on.map(c=>c.id));S.pc.pos=0;save()}
  return PL.map.get(S.pc.deck[S.pc.pos%S.pc.deck.length]);
}
const faceHtml=r=>r==='pw'?PW_FACE:r==='chaos'?CHAOS_FACE:r==='blank'?'':ico(I_DIE);

/* planar die: 1x planeswalk, 1x chaos, 4x leeg; elke extra worp in dezelfde beurt kost 1 mana meer */
function planarRoll(){
  if(pRolling||!curPlane())return;pRolling=true;
  const n=Math.floor(Math.random()*6),res=n===0?'pw':n===1?'chaos':'blank',red=matchMedia('(prefers-reduced-motion: reduce)').matches;

const I_TURN='<path d="M4.5 12a7.5 7.5 0 0 1 13.2-4.9M19.5 12a7.5 7.5 0 0 1-13.2 4.9"/><path d="M18 3v4.5h-4.5M6 21v-4.5h4.5"/>';

/* ==== Apparaten koppelen (WebRTC, alleen lokaal netwerk, uitwisseling via QR-codes) ====
   Geen server: de host toont een QR met zijn verbindingsgegevens, de gast scant en toont een QR terug, de host scant die.
   iceServers leeg = alleen lokale routes, dus alleen op hetzelfde (niet-gast) wifi. Het datakanaal is versleuteld (DTLS).
   Host is de baas: gasten sturen alleen acties uit een vaste lijst; de host controleert ze en stuurt de stand terug. */
const I_LINK='<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>';
var G={role:null,pc:null,ch:null,st:null,tok:20,tt:0,timer:null,scan:null};
const HOSTONLY=new Set(['n','start','first','new','pc','pdie','pcost','name']);
const GBK='lt-guest-backup';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function toHost(m){if(G.role==='guest'&&G.ch?.readyState==='open')G.ch.send(JSON.stringify(m))}
const gameState=()=>({n:S.n,start:S.start,link:S.link,turnOn:S.turnOn,mana:S.mana,storm:S.storm,players:S.players,pc:S.pc,tt:S.tt});

/* verbindingsgegevens compact maken voor een kleine QR: alleen wat WebRTC nodig heeft */
const ICE=/^[A-Za-z0-9+/]{4,256}$/,ADDR=/^[0-9A-Za-z.:-]{3,64}$/;
function pack(sdp,t){
  const g=r=>(sdp.match(r)||[])[1]||'',c=[];
  for(const l of sdp.split(/\r?\n/))if(l.startsWith('a=candidate:')){const f=l.slice(12).split(' ');if(f[2]?.toLowerCase()==='udp'&&f[7]==='host'&&c.length<8)c.push(f[4]+'/'+f[5])}
  return ['LT1',t,g(/a=ice-ufrag:(\S+)/),g(/a=ice-pwd:(\S+)/),g(/a=fingerprint:sha-256 (\S+)/).replace(/:/g,''),c.join(',')].join('|');
}
function unpack(s,t){
  const p=String(s).trim().split('|');if(p.length!==6||p[0]!=='LT1'||p[1]!==t)return null;
  const[, ,u,w,f,cs]=p,c=cs?cs.split(',').map(x=>x.split('/')):[];
  if(!ICE.test(u)||!ICE.test(w)||!/^[0-9A-Fa-f]{64}$/.test(f)||!c.length||c.length>8)return null;
  for(const[a,port]of c)if(!ADDR.test(a||'')||!(+port>0&&+port<65536))return null;
  return{u,w,f:f.toUpperCase().match(/../g).join(':'),c};
}
function sdpOf(d,setup){
  return ['v=0','o=- 1 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','a=msid-semantic: WMS','m=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0',
    'a=ice-ufrag:'+d.u,'a=ice-pwd:'+d.w,'a=fingerprint:sha-256 '+d.f,'a=setup:'+setup,'a=mid:0','a=sctp-port:5000','a=max-message-size:262144',
    ...d.c.map(([a,p],k)=>`a=candidate:${k+1} 1 udp ${2122260223-k} ${a} ${+p} typ host generation 0`),''].join('\r\n');
}
const iceDone=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,3000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})});
function newPc(){const pc=new RTCPeerConnection({iceServers:[]});pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&G.pc===pc)linkReset(G.role?T('Connection lost.'):T('Could not connect. Make sure both devices are on the same Wi-Fi (not a guest network) and try again.'))};G.pc=pc;return pc}

function linkReset(msg){
  stopScan();clearTimeout(G.timer);const wasGuest=G.role==='guest',pc=G.pc;G.role=null;G.ch=null;G.pc=null;
  try{pc?.close()}catch(e){}
  if(wasGuest){try{const b=JSON.parse(localStorage.getItem(GBK));if(b?.players?.length===6){S=b;save()}}catch(e){}try{localStorage.removeItem(GBK)}catch(e){}}
  render();if(msg)toast(msg);if(!sheet.hidden&&sheet.querySelector('.lbox'))showLink();
}
function setupCh(ch,role){
  ch.onopen=()=>{clearTimeout(G.timer);G.ch=ch;G.role=role;
    if(role==='guest'){try{localStorage.setItem(GBK,JSON.stringify(S))}catch(e){}}else linkSync();
    stopScan();sheet.hidden=true;render();toast(T(role==='host'?'Device linked.':'Linked to the host device.'))};
  ch.onmessage=e=>{if(typeof e.data!=='string')return;role==='host'?fromGuest(e.data):fromHost(e.data)};
  ch.onclose=()=>{if(G.ch===ch)linkReset(T('Connection lost.'))};
}
async function hostStart(){
  linkReset();const pc=newPc();setupCh(pc.createDataChannel('lt',{ordered:true}),'host');
  await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);
  const code=pack(pc.localDescription.sdp,'o');
  if(code.endsWith('|'))return linkReset(T('No local network found. Connect this device to Wi-Fi and try again.'));
  showCode(T('Step 1 of 2'),T('On the other device open Settings → Link devices → Join, and scan this code. Then tap “Scan reply”.'),code,'<button class="new" data-lscan="a">'+T('Scan reply')+'</button>');
}
async function hostAnswer(txt){
  const d=unpack(txt,'a');if(!d||!G.pc||G.pc.signalingState!=='have-local-offer')return toast(T('That is not a reply code from this app.'));
  stopScan();showWait(T('Connecting…'));G.timer=setTimeout(()=>linkReset(T('Could not connect. Make sure both devices are on the same Wi-Fi (not a guest network) and try again.')),12000);
  try{await G.pc.setRemoteDescription({type:'answer',sdp:sdpOf(d,'active')})}catch(e){linkReset(T('That reply code did not work. Start again.'))}
}
async function guestJoin(txt){
  const d=unpack(txt,'o');if(!d)return toast(T('That is not a host code from this app.'));
  stopScan();linkReset();const pc=newPc();pc.ondatachannel=e=>{if(e.channel.label==='lt')setupCh(e.channel,'guest')};
  try{await pc.setRemoteDescription({type:'offer',sdp:sdpOf(d,'actpass')});await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc)}
  catch(e){return linkReset(T('That code did not work. Ask the host to start again.'))}
  const code=pack(pc.localDescription.sdp,'a');
  if(code.endsWith('|'))return linkReset(T('No local network found. Connect this device to Wi-Fi and try again.'));
  G.timer=setTimeout(()=>{if(!G.role)linkReset(T('Could not connect. Make sure both devices are on the same Wi-Fi (not a guest network) and try again.'))},120000);
  showCode(T('Step 2 of 2'),T('Let the host device scan this code.'),code,'');
}

/* host: berichten van een gast — alleen bekende acties, met grenzen en een snelheidslimiet */
const isInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
function fromGuest(raw){
  const now=Date.now();G.tok=Math.min(20,G.tok+(now-G.tt)/50);G.tt=now;if(G.tok<1)return;G.tok--;
  if(raw.length>300)return;let m;try{m=JSON.parse(raw)}catch(e){return}if(!m||typeof m!=='object')return;
  const pl=v=>isInt(v,0,S.n-1),kOk=k=>typeof k==='string'&&COUNTERS.some(t=>t.k===k);
  switch(m.a){
    case 'life':if(pl(m.i)&&isInt(m.d,-10,10)&&m.d)life(m.i,m.d);break;
    case 'cmd':if(pl(m.i)&&pl(m.f)&&m.i!==m.f&&(m.d===1||m.d===-1))cmd(m.i,m.f,m.d);break;
    case 'cn':if(pl(m.i)&&kOk(m.k)&&(m.d===1||m.d===-1))ctrChange(m.i,m.k,m.d);break;
    case 'cntog':if(pl(m.i)&&kOk(m.k))ctrToggle(m.i,m.k);break;
    case 'mana':if(m.clr==='mana'||m.clr==='storm')manaChange(null,0,m.clr);else if((m.m==='s'||isInt(m.m,0,5))&&(m.d===1||m.d===-1))manaChange(m.m,m.d);break;
    case 'end':endTurn();break;
    case 'undo':undoTurn(true);if(!sheet.hidden&&sheet.querySelector('.hlist'))showHistory();break;
  }
}
/* gast: stand van de host — eerst volledig controleren en opschonen, dan pas gebruiken */
function cleanState(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.players)||s.players.length!==6)return null;
  const int=(v,a,b,d)=>isInt(v,a,b)?v:d,n=int(s.n,2,6,4),six=(a,lo,hi)=>[0,1,2,3,4,5].map(k=>int(Array.isArray(a)?a[k]:0,lo,hi,0));
  const players=s.players.map((p,i)=>{p=p&&typeof p==='object'?p:{};const o={name:typeof p.name==='string'&&p.name.trim()?p.name.slice(0,18):T('Player {n}',{n:i+1}),
      color:int(p.color,0,5,i),life:int(p.life,-99999,99999,40),cmd:six(p.cmd,0,999)};
    if(okArt(p.art)){o.art=p.art;o.artist=typeof p.artist==='string'?p.artist.slice(0,60):''}
    if(p.cn&&typeof p.cn==='object')o.cn=Object.fromEntries(COUNTERS.filter(t=>Object.hasOwn(p.cn,t.k)).map(t=>[t.k,int(p.cn[t.k],0,999,0)]));
    return o});
  const ID=/^[0-9a-f-]{36}$/,ids=a=>Array.isArray(a)?a.filter(x=>typeof x==='string'&&ID.test(x)).slice(0,500):[],q=s.pc&&typeof s.pc==='object'?s.pc:{};
  const pc={on:!!q.on,off:ids(q.off),deck:ids(q.deck),pos:int(q.pos,0,499,0),cost:int(q.cost,0,99,0),last:['pw','chaos','blank'].includes(q.last)?q.last:null,defs:1};
  let tt;const r=s.tt;
  if(r&&typeof r==='object'&&isInt(r.active,0,n-1)&&isInt(r.start,0,n-1)&&Array.isArray(r.log)){
    const log=r.log.slice(-400).filter(g=>g&&isInt(g.r,1,9999)&&isInt(g.p,0,n-1)&&Array.isArray(g.ev)).map(g=>({r:g.r,p:g.p,
      ev:g.ev.slice(0,12).filter(e=>e&&isInt(e.t,0,n-1)).map(e=>({t:e.t,from:int(e.from,-99999,99999,0),to:int(e.to,-99999,99999,0),src:Array.isArray(e.src)?e.src.filter(x=>isInt(x,0,n-1)).slice(0,6):[]}))}));
    if(log.length)tt={start:r.start,active:r.active,round:int(r.round,1,9999,1),log};
  }
  return{n,start:int(s.start,1,9999,40),link:!!s.link,turnOn:!!s.turnOn,mana:six(s.mana,0,999),storm:int(s.storm,0,999,0),players,pc,tt};
}
function fromHost(raw){
  if(raw.length>300000)return;let m;try{m=JSON.parse(raw)}catch(e){return}if(m?.t!=='s')return;
  const c=cleanState(m.s);if(!c)return;
  S={...S,...c};if(!c.tt)delete S.tt;open.forEach(i=>{if(i>=S.n)open.delete(i)});
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();
  if(!pop.hidden&&popKind==='mana')pop.innerHTML=manaHtml();if(!sheet.hidden&&sheet.querySelector('.hlist'))showHistory();
}

/* schermen */
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:6,margin:3,scalable:true})}catch(e){return ''}}
function showLink(){
  const st=G.role==='host'?T('This device is the host. One device is linked.'):G.role==='guest'?T('This device is linked to a host. Its own game is kept and comes back when you disconnect.'):'';
  sheet.innerHTML=`<div class="box lbox" role="dialog" aria-label="${T('Link devices')}"><h2>${T('Link devices')}</h2>
    ${G.role?`<p class="lmsg">${st}</p><div class="acts"><button data-loff>${T('Disconnect')}</button><button class="new" data-close>${T('Done')}</button></div>`:
    `<p class="lmsg">${T('Use two devices on the same Wi-Fi as one tracker. Nothing goes through the internet: the devices exchange two QR codes and then talk directly, encrypted.')}</p>
     <div class="acts"><button class="new" data-lhost>${T('Host (show code)')}</button><button data-lscan="o">${T('Join (scan code)')}</button></div>
     <div class="acts"><button data-back>${T('Back')}</button></div>`}</div>`;
  sheet.hidden=false;
}
function showWait(t){sheet.innerHTML=`<div class="box lbox" role="dialog" aria-label="${T('Link devices')}"><h2>${T('Link devices')}</h2><p class="lmsg">${t}</p><div class="acts"><button data-loff>${T('Cancel')}</button></div></div>`;sheet.hidden=false}
function showCode(step,help,code,btn){
  sheet.innerHTML=`<div class="box lbox" role="dialog" aria-label="${T('Link devices')}"><h2>${T('Link devices')} <small>${step}</small></h2><p class="lmsg">${help}</p>
    <div class="qr">${qrSvg(code)}</div>
    <details class="lalt"><summary>${T("Can't scan?")}</summary><p class="lmsg">${T('Copy this code to the other device:')}</p><textarea readonly rows="3">${esc(code)}</textarea><button data-lcopy>${T('Copy code')}</button></details>
    <div class="acts">${btn}<button data-loff>${T('Cancel')}</button></div></div>`;
  sheet.hidden=false;sheet.querySelector('textarea').value=code;
}
/* camera alleen tijdens het scannen; daarna direct uit. Geen scanner in de browser: code plakken */
async function startScan(kind){
  stopScan();const hasBD='BarcodeDetector' in window;
  sheet.innerHTML=`<div class="box lbox" role="dialog" aria-label="${T('Scan code')}"><h2>${T(kind==='o'?'Scan the host code':'Scan the reply code')}</h2>
    ${hasBD?'<video class="lvid" playsinline muted></video><p class="lmsg" id="lst">'+T('Point the camera at the code on the other device.')+'</p>':'<p class="lmsg">'+T('This browser cannot scan QR codes. Paste the code text instead.')+'</p>'}
    <form class="lpaste"><textarea id="lcode" rows="3" placeholder="${T('Or paste the code here')}" autocomplete="off"></textarea><button>${T('Use code')}</button></form>
    <div class="acts"><button data-loff>${T('Cancel')}</button></div></div>`;
  sheet.hidden=false;sheet.querySelector('.lpaste').dataset.kind=kind;if(!hasBD)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}),v=sheet.querySelector('.lvid');
    if(!v){stream.getTracks().forEach(t=>t.stop());return}
    G.scan={stream,on:true};v.srcObject=stream;await v.play();const bd=new BarcodeDetector({formats:['qr_code']});
    (async function loop(){if(!G.scan?.on)return;try{const r=await bd.detect(v);const hit=r.find(x=>x.rawValue?.startsWith('LT1|'));if(hit){useCode(kind,hit.rawValue);return}}catch(e){}setTimeout(loop,250)})();
  }catch(e){const s=$('#lst');if(s)s.textContent=T('The camera could not be opened. Allow camera access, or paste the code below.')}
}
function stopScan(){if(G.scan){G.scan.on=false;G.scan.stream.getTracks().forEach(t=>t.stop());G.scan=null}}
function useCode(kind,txt){kind==='o'?guestJoin(txt):hostAnswer(txt)}
sheet.addEventListener('submit',e=>{const f=e.target.closest('.lpaste');if(!f)return;e.preventDefault();useCode(f.dataset.kind,$('#lcode').value)});
sheet.addEventListener('click',e=>{if(e.target===sheet)return stopScan();const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if('close' in ds||'back' in ds)stopScan();
  if('lhost' in ds)hostStart().catch(()=>linkReset(T('Linking is not supported on this device.')));
  else if(ds.lscan)startScan(ds.lscan);
  else if('loff' in ds){linkReset(G.role?T('Disconnected.'):'');showLink()}
  else if('llink' in ds)showLink();
  else if('lcopy' in ds){const t=sheet.querySelector('.lalt textarea');navigator.clipboard?.writeText(t.value).then(()=>toast(T('Code copied.')),()=>{t.select()})}
});
try{const b=JSON.parse(localStorage.getItem(GBK));if(b?.players?.length===6){S=b;save()}localStorage.removeItem(GBK)}catch(e){}

/* ==== Scherm aan houden ==== */
let lock=null;
async function wake(){if(lock||!navigator.wakeLock)return;try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
