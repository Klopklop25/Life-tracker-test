<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Commander Life Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap">
<style>
/* Speeltafel: tegels rondom het tablet, bovenste rij 180° gedraaid naar de spelers aan de overkant. Donker als basis, licht via thema of systeem. Rechte hoeken. */
:root{
  color-scheme:dark;
  --bg:#121118; --fg:#f5f2ea; --muted:#a39db0; --line:#2e2a3a; --panel:#1d1a26; --panel2:#282435;
  --danger:#ff5544; --warn:#ffbf2e; --accent:#ffb627;
  --f-num:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#efece6;--fg:#17151d;--muted:#655f70;--line:#d6d0c6;--panel:#fbfaf7;--panel2:#e6e1d8;--danger:#e3341f;--warn:#c88a00;--accent:#d98c00}}
:root[data-theme="light"]{color-scheme:light;--bg:#efece6;--fg:#17151d;--muted:#655f70;--line:#d6d0c6;--panel:#fbfaf7;--panel2:#e6e1d8;--danger:#e3341f;--warn:#c88a00;--accent:#d98c00}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
input{user-select:text;-webkit-user-select:text}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#board{--bh:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));--bs:clamp(32px,calc(var(--bh)/13),52px);height:100%;display:grid;grid-template-rows:1fr auto 1fr;gap:6px 10px}
/* staand scherm (telefoon): het hele speelveld een kwartslag draaien, zodat de liggende indeling blijft */
@media (orientation:portrait){#board{--bh:calc(100dvw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  position:fixed;left:50%;top:50%;width:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:var(--bh);transform:translate(-50%,-50%) rotate(90deg)}}
.bar{grid-column:1/-1;grid-row:2;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;pointer-events:none}
.bar button{pointer-events:auto;box-shadow:0 0 0 5px var(--bg);flex:none;min-height:44px;padding:0 14px;background:var(--panel2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bar button b{font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:0}
.bar button:active{background:var(--line)}
.bar button.sure{background:var(--danger);color:#1a0d0b}
.bar .ic{padding:0;width:52px;justify-content:center}
.bar svg{width:24px;height:24px}
#pop{position:fixed;z-index:15;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 32px rgb(0 0 0/.55);transform:translate(-50%,-50%)}
#pop button{min-width:58px;min-height:54px;background:var(--panel2);font-family:var(--f-num);font-weight:700;font-size:28px}
#pop button.on{background:var(--accent);color:var(--bg)}
.opts svg{width:28px;height:28px}
.opts{display:flex;gap:6px}
.roll{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 4px}
.die{width:96px;height:96px;perspective:420px}
.die.dn{transform:rotate(180deg)}
.dw{position:relative;width:100%;height:100%;display:grid;place-items:center}
.dw svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--panel2);stroke:var(--muted);stroke-width:3;stroke-linejoin:round}
.dw svg .ln{fill:none;opacity:.45}
.dw b{position:relative;transform:translateY(var(--ty,0));font-family:var(--f-num);font-weight:900;font-size:38px;line-height:1;opacity:.55;font-variant-numeric:tabular-nums}
.dw.munt b{font-size:24px}
.die.fin svg{stroke:var(--accent)}.die.fin b{opacity:1;color:var(--accent)}
.dw.go{animation:tumble 1.15s cubic-bezier(.2,.7,.3,1)}
.dw.flip{animation:flip 1.15s cubic-bezier(.3,.6,.4,1)}
@keyframes tumble{0%{transform:translate(-46px,-26px) rotate(-260deg) scale(.55)}25%{transform:translate(-14px,10px) rotate(-90deg) scale(1)}45%{transform:translate(6px,-10px) rotate(25deg)}65%{transform:translate(-2px,3px) rotate(-10deg)}82%{transform:translate(1px,-1px) rotate(3deg)}100%{transform:none}}
@keyframes flip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-34px) rotateY(900deg) scale(1.1)}80%{transform:translateY(2px) rotateY(1340deg)}100%{transform:translateY(0) rotateY(1440deg)}}
@media (prefers-reduced-motion:reduce){.dw{animation:none!important}}
.mana{position:relative;display:grid;gap:6px;padding:2px 4px}
#pop.r180{transform:translate(-50%,-50%) rotate(180deg)}
#pop .mana .turn{position:absolute;top:-2px;right:-2px;min-width:0;min-height:0;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.mana .turn svg{width:22px;height:22px}
.mana h3{margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#pop .mana h3 button{min-width:0;min-height:0;width:36px;height:36px;background:none;color:var(--muted);display:grid;place-items:center}
.mana h3 svg{width:18px;height:18px}
.mrow{display:grid;grid-template-columns:48px 56px 64px 48px;align-items:center;justify-items:center;gap:10px}
#pop .mrow button{min-width:0;min-height:0;width:48px;height:48px;font-size:28px;line-height:1}
.mi{width:52px;height:52px;display:block;transition:opacity .2s}
.mi svg{display:block;width:100%;height:100%}
.mrow b{font-family:var(--f-num);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;transition:opacity .2s}
.mrow.zero .mi{opacity:.3}.mrow.zero b{opacity:.35}
.roll span{color:var(--muted);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}

.tile{position:relative;container-type:size;overflow:hidden;background:var(--c);color:var(--t);min-width:0;min-height:0;transition:filter .3s}
.inner{position:absolute;inset:0;container-type:size}
.inner.rot{transform:rotate(180deg)}
.inner.side{inset:auto;left:50%;top:50%;width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(-90deg)}
.art{position:absolute;inset:0;background:center/cover no-repeat;pointer-events:none}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(0 0 0/.3),rgb(0 0 0/.15) 40%,rgb(0 0 0/.55))}
.tile.has-art .life,.tile.has-art .name,.tile.has-art .delta{text-shadow:0 2px 14px rgb(0 0 0/.7)}
.credit{position:absolute;right:12px;bottom:8px;max-width:30%;font-size:10px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.zone{position:absolute;top:0;bottom:0;width:50%;transition:background .12s}
.zone[data-z="-1"]{left:0}.zone[data-z="1"]{right:0}
.zone.press{background:rgb(0 0 0/.14)}
.sign{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-weight:700;font-size:min(16cqh,11cqw);opacity:.35;pointer-events:none}
.sign.m{left:6cqw}.sign.p{right:6cqw}
.name{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:600;font-size:clamp(13px,6cqh,20px);letter-spacing:.06em;text-transform:uppercase;opacity:.8;pointer-events:none;padding-inline:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.life{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:min(52cqh,34cqw);line-height:1;font-variant-numeric:tabular-nums;pointer-events:none}
.delta{position:absolute;left:0;right:0;top:calc(50% - min(34cqh,22cqw));text-align:center;font-family:var(--f-num);font-weight:700;font-size:min(13cqh,8cqw);pointer-events:none;opacity:0;transition:opacity .25s}
.delta.on{opacity:.85}
.cmdbtn{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 16px;background:rgb(0 0 0/.22);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.cmdbtn svg{width:20px;height:20px}
.cmdbtn.hot{background:var(--danger);color:#1a0d0b}
.out{position:absolute;top:calc(50% + min(28cqh,18cqw));left:0;right:0;text-align:center;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;pointer-events:none;display:none}
.tile.dead{filter:grayscale(.85) brightness(.55)}
.tile.dead .out{display:block}
.tile.pick{outline:6px solid var(--fg);outline-offset:-6px}
.start{position:absolute;top:calc(50% + min(28cqh,18cqw));left:50%;transform:translateX(-50%);padding:5px 16px;background:var(--fg);color:var(--bg);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;display:none}
.tile.first .start{display:block}

/* commandant-schade */
.cmd{position:absolute;inset:0;background:var(--panel);color:var(--fg);display:flex;flex-direction:column;padding:10px 12px;gap:6px}
.cmd header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.cmd header button{min-width:44px;min-height:44px;font-size:26px;line-height:1;color:var(--fg)}
.rows{display:grid;gap:6px;overflow:auto;align-content:start}
.row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;background:var(--panel2);padding:4px 4px 4px 12px}
.row .who{display:flex;align-items:center;gap:8px;min-width:0;font-size:17px}
.row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:14px;height:14px;background:var(--c);box-shadow:0 0 0 1px rgb(255 255 255/.25)}
.row button{width:52px;height:48px;background:var(--line);font-family:var(--f-num);font-weight:700;font-size:28px}
.row button:active{background:var(--muted);color:var(--bg)}
.row b{min-width:48px;text-align:center;font-family:var(--f-num);font-size:32px;font-variant-numeric:tabular-nums}
.row b.w{color:var(--warn)}.row b.d{color:var(--danger)}


/* instellingen */
#sheet{position:fixed;inset:0;z-index:20;background:rgb(10 9 14/.72);display:grid;place-items:center;padding:16px}
.box{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:20px;display:grid;gap:18px}
.box h2{margin:0;font-family:var(--f-num);font-weight:900;font-size:30px;letter-spacing:.02em}
.grp{display:grid;gap:8px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:56px;min-height:48px;background:var(--panel2);font-family:var(--f-num);font-weight:700;font-size:24px;padding-inline:14px}
.seg button.on{background:var(--accent);color:var(--bg)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:17px}
.sw{flex:none;width:58px;height:34px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;background:var(--fg);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(24px);background:var(--bg)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
@media (max-width:560px){.pl{grid-template-columns:minmax(0,1fr) auto}.pl .cols{grid-column:1/-1;order:3}}
.artbtn{width:64px;height:44px;background:var(--panel2) center/cover;display:grid;place-items:center;color:var(--muted)}
.artbtn svg{width:22px;height:22px}
.box.wide{width:min(920px,100%)}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:18px;padding:0 14px}
.srch button{min-height:48px;padding:0 20px;background:var(--accent);color:var(--bg);font-weight:600;font-size:17px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:55vh;overflow:auto;align-content:start}
.res button{display:grid;gap:4px;text-align:left;padding:0 0 6px;background:var(--panel2);overflow:hidden}
.res img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.res small{padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .on{box-shadow:inset 0 0 0 3px var(--accent)}
.msg{grid-column:1/-1;margin:8px 0;color:var(--muted);font-size:16px}
.pl input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:17px;padding:0 12px}
.cols{display:flex;gap:4px}
.cols button{width:32px;height:44px;background:var(--c);opacity:.45}
.cols button.on{opacity:1;box-shadow:inset 0 0 0 3px var(--fg)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{flex:1 1 140px;min-height:52px;background:var(--panel2);font-weight:600;font-size:17px}
.acts .new{background:var(--accent);color:var(--bg)}
.acts .new.sure{background:var(--danger)}

/* verticale menubalk naast de hoofdplek, gedraaid naar die speler */
.bar.vert{grid-column:-3/-2;grid-row:1/4;flex-direction:column-reverse;gap:min(8px,calc(var(--bh)/90))}
.bar.vert button{writing-mode:vertical-rl;transform:rotate(180deg);width:var(--bs);min-height:0;padding:calc(var(--bs)*.2) 0;justify-content:center;gap:4px}
.bar.vert .ic{height:var(--bs)}
.bar.vert svg{transform:rotate(90deg);width:calc(var(--bs)*.46);height:calc(var(--bs)*.46)}
.bar.vert button b{font-size:calc(var(--bs)*.46)}
.bar button.on{color:var(--accent)}
.name{pointer-events:auto;cursor:text;margin-inline:auto;width:fit-content;max-width:100%;padding-block:4px}
.namein{width:min(320px,90cqw);min-height:40px;border:2px solid var(--accent);background:var(--panel);color:var(--fg);font:inherit;font-size:18px;text-align:center;text-transform:none;letter-spacing:0;padding:0 10px}
.custom{display:flex;gap:6px}
.custom input{flex:1;min-width:0;width:120px;min-height:54px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-family:var(--f-num);font-weight:700;font-size:28px;padding:0 12px}
#pop .custom button{font-family:var(--f-ui);font-weight:600;font-size:18px;padding:0 18px;background:var(--accent);color:var(--bg)}
/* planechase */
.plane{background:var(--panel);color:var(--fg)}
.pimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pimg img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.pimg p{margin:0;padding:12px;text-align:center;color:var(--muted);font-size:16px}
.pimg p button{display:block;margin:10px auto 0;min-height:44px;padding:0 16px;background:var(--accent);color:var(--bg);font-weight:600}
/* de kaart ligt een kwartslag gedraaid in het vak: zijn rechterbovenhoek is linksboven in het vak */
.pbar{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pdie{width:48px;height:48px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 2px 10px rgb(0 0 0/.4);transform:rotate(-90deg)}
.pdie .face{display:grid;place-items:center;width:28px;height:28px}
.pdie .face svg{max-width:28px;max-height:28px;width:100%;height:100%}
.pdie .face.go{animation:tumble .95s cubic-bezier(.2,.7,.3,1)}
.pdie.r-pw{border-color:var(--accent);color:var(--accent)}.pdie.r-chaos{border-color:var(--danger);color:var(--danger)}
.pcost{width:40px;padding:10px 0;background:var(--panel2);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;color:var(--muted);box-shadow:0 2px 10px rgb(0 0 0/.4)}
.pcost>*{transform:rotate(-90deg)}
#proll{position:fixed;inset:0;z-index:25;background:rgb(0 0 0/.6);display:grid;place-content:center;justify-items:center;gap:18px;cursor:pointer}
.bigdie{width:min(200px,40vmin);height:min(200px,40vmin);background:var(--panel);border:4px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 16px 48px rgb(0 0 0/.5)}
.bigdie .face{display:grid;place-items:center;width:58%;height:58%}
.bigdie .face svg{width:100%;height:100%}
.bigdie .face.go{animation:tumble 1.2s cubic-bezier(.2,.7,.3,1)}
.bigdie.r-pw{border-color:var(--accent);color:var(--accent)}.bigdie.r-chaos{border-color:var(--danger);color:var(--danger)}
#proll .lbl{min-height:1.2em;font-family:var(--f-num);font-weight:900;font-size:min(44px,9vmin);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px rgb(0 0 0/.6)}
.pcost svg{width:16px;height:16px}.pcost b{font-family:var(--f-num);font-size:22px;color:var(--fg)}
.pcm{display:grid;gap:8px;min-width:280px;padding:4px}
#pop .pcm button{font-family:var(--f-ui);font-weight:600;font-size:17px;padding:0 14px}
#pop .pcm .tog{background:none;font-size:19px}
.pcrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box h2 small{font-family:var(--f-ui);font-size:15px;font-weight:600;color:var(--muted);margin-left:8px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 12px;max-height:50vh;overflow:auto;align-content:start}
.prow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;padding:6px 8px;background:var(--panel2);cursor:pointer}
.prow input{width:22px;height:22px;grid-row:span 2;accent-color:var(--accent)}
.prow span{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:12px;color:var(--muted)}
#zoom{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.88);display:grid;place-items:center;cursor:zoom-out}
#zoom img{width:min(90vh,66vw);transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="board"></div>
<div id="pop" hidden></div>
<div id="zoom" hidden></div>
<div id="proll" hidden></div>
<div id="sheet" hidden></div>

<script>
const COLORS=[{n:'White',c:'#f4e7b8',t:'#1f1b10'},{n:'Blue',c:'#1f78e0',t:'#f2f8ff'},{n:'Black',c:'#4b2f73',t:'#f5efff'},{n:'Red',c:'#e5381f',t:'#fff4ef'},{n:'Green',c:'#1d9b4b',t:'#f0fff4'},{n:'Gold',c:'#f0a50e',t:'#231600'}];
const KEY='mtg-leventeller-v1',LETHAL=21;
const $=s=>document.querySelector(s),board=$('#board'),sheet=$('#sheet');
const ICON_CMD='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3v5.7c0 4.7-3.2 8.6-7.5 10.3-4.3-1.7-7.5-5.6-7.5-10.3V5.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

/* ==== Status ==== */
const fresh=(n,start,prev)=>({n,start,link:prev?prev.link:true,theme:prev?.theme||'auto',
  pc:prev?.pc?{...prev.pc,deck:[],pos:0,cost:0,last:null}:undefined,mana:[0,0,0,0,0,0],storm:0,players:[0,1,2,3,4,5].map(i=>{const q=prev?.players[i];return{name:q?q.name:`Player ${i+1}`,color:q?q.color:i,...(q?.art&&{art:q.art,artist:q.artist}),life:start,cmd:[0,0,0,0,0,0]}})});
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.players&&s.players.length===6?s:null}catch(e){return null}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let S=load()||fresh(4,40);
S.mana??=[0,0,0,0,0,0];S.storm??=0;S.players.forEach(p=>p.name=p.name.replace(/^Speler (\d)$/,'Player $1'));
S.theme??='auto';S.pc??={on:false,off:[],deck:[],pos:0,cost:0,last:null};
function applyTheme(){
  const r=document.documentElement,t=S.theme;if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  const light=t==='light'||t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches;
  document.querySelector('meta[name="theme-color"]').content=light?'#efece6':'#121118';
}
applyTheme();matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',applyTheme);
const open=new Set(),pend=[0,0,0,0,0,0],pendT=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Indeling per aantal spelers: kolommen en [kolom,rij] per speler. Rij 1 kijkt naar de overkant, rij 1/4 zit aan het hoofd (rechts).
   Zonder hoofdplek ligt de menubalk horizontaal in rij 2; met hoofdplek (3 en 5 spelers, of Planechase) staat hij verticaal
   in de kolom vóór het hoofd. Bij Planechase (max. 4 spelers) ligt de planeskaart op de hoofdplek. Met de klok mee. */
const LAYOUT={2:['1fr',[[1,1],[1,3]]],3:['2fr auto .9fr',[[1,1],[3,'1/4'],[1,3]]],4:['1fr 1fr',[[1,1],[2,1],[1,3],[2,3]]],
  5:['1fr 1fr auto .9fr',[[1,1],[2,1],[4,'1/4'],[2,3],[1,3]]],6:['repeat(3,1fr)',[[1,1],[2,1],[3,1],[1,3],[2,3],[3,3]]]};
/* kolom van de planeskaart even breed als de kaart (488:680) bij volle hoogte, zodat hij het vlak vult */
const PCW='min(45%,calc(var(--bh)*.7176))';
document.addEventListener('fullscreenchange',()=>{if(!sheet.hidden&&sheet.querySelector('[data-fs]'))showMenu()});
const LAYOUT_PC={2:[`1fr auto ${PCW}`,[[1,1],[1,3]]],3:[`1fr 1fr auto ${PCW}`,[[1,1],[2,1],['1/3',3]]],4:[`1fr 1fr auto ${PCW}`,[[1,1],[2,1],[2,3],[1,3]]]};
const pcOn=()=>S.pc.on&&S.n<=4;
const lay=()=>(pcOn()?LAYOUT_PC:LAYOUT)[S.n];
const vert=()=>lay()[0].includes('auto');
const turn=i=>{const r=lay()[1][i][1];return r==='1/4'?' side':r===1?' rot':''};
const untouched=()=>S.players.slice(0,S.n).every(p=>p.life===S.start&&p.cmd.every(v=>!v));
/* alleen afbeeldingen van Scryfall (opgeslagen waarde komt uit localStorage) */
const okArt=u=>typeof u==='string'&&/^https:\/\/cards\.scryfall\.io\/[\w\-./]+(\?\d+)?$/.test(u)?u:'';
const I_IMG='<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8.5"/>';
const isDead=p=>p.life<=0||p.cmd.some((v,j)=>j<S.n&&v>=LETHAL);

/* ==== Weergave ==== */
function render(){
  const L=lay();board.style.gridTemplateColumns=L[0];
  let h='';
  for(let i=0;i<S.n;i++){
    const p=S.players[i],col=COLORS[p.color],[c,r]=L[1][i];
    const art=okArt(p.art);
    h+=`<div class="tile${art?' has-art':''}" data-i="${i}" style="--c:${col.c};--t:${art?'#fff':col.t};grid-column:${c};grid-row:${r}"><div class="inner${turn(i)}">
      ${art?`<div class="art" style="background-image:url('${art}')"></div><div class="credit">${p.artist?'Illus. '+esc(p.artist):''}</div>`:''}
      <div class="zone" data-z="-1"></div><div class="zone" data-z="1"></div>
      <span class="sign m">−</span><span class="sign p">+</span>
      <div class="name" data-act="name"></div><div class="delta"></div><div class="life"></div><div class="out"></div><div class="start">Goes first</div>
      <button class="cmdbtn" data-act="cmd" aria-label="Commander damage">${ICON_CMD}<span></span></button>
      <div class="cmd" hidden></div></div></div>`;
  }
  if(pcOn()){h+=`<div class="tile plane" style="grid-column:-2/-1;grid-row:1/4"></div>`;if(!PL.cards&&!PL.state)loadPlanes()}
  board.innerHTML=h+`<div class="bar${vert()?' vert':''}"></div>`;
  for(let i=0;i<S.n;i++)update(i);
  bar();renderPlane();
}
function bar(){
  board.querySelector('.bar').innerHTML=`<button data-act="n" aria-label="Number of players">${ico(I_PERSON)}<b>${S.n}</b></button>
    <button data-act="start" aria-label="Starting life">${ico(I_HEART)}<b>${S.start}</b></button>
    <button data-act="first" class="ic" aria-label="Who goes first">${ico(I_CROWN)}</button>
    <button data-act="dice" class="ic" aria-label="Dice">${ico(I_DIE)}</button>
    <button data-act="mana" class="ic" aria-label="Mana and storm">${ico(I_MANA)}</button>
    <button data-act="pc" class="ic${S.pc.on?' on':''}" aria-label="Planechase">${I_PC}</button>
    <button data-act="new" class="${sure?'sure':'ic'}" aria-label="Restart">${ico(I_RESET)}${sure?'<b>?</b>':''}</button>
    <button data-act="menu" class="ic" aria-label="Names and settings">${ICON_MENU}</button>`;
}
function update(i){
  const p=S.players[i],el=board.querySelector(`.tile[data-i="${i}"]`);if(!el)return;
  const nm=el.querySelector('.name');if(!nm.querySelector('input'))nm.textContent=p.name;
  el.querySelector('.life').textContent=p.life;
  const tot=p.cmd.slice(0,S.n).reduce((a,b)=>a+b,0),cb=el.querySelector('.cmdbtn');
  cb.querySelector('span').textContent=tot?tot:'';
  cb.classList.toggle('hot',p.cmd.some((v,j)=>j<S.n&&v>=15));
  const dead=isDead(p);el.classList.toggle('dead',dead);
  el.querySelector('.out').textContent=p.life<=0?'Eliminated':`${LETHAL} commander damage`;
  const d=pend[i],de=el.querySelector('.delta');de.textContent=d>0?'+'+d:d<0?'−'+(-d):'';de.classList.toggle('on',!!d);
  const c=el.querySelector('.cmd');c.hidden=!open.has(i);if(open.has(i))c.innerHTML=cmdHtml(i);
}
function cmdHtml(i){
  const p=S.players[i];let r='';
  for(let j=0;j<S.n;j++){if(j===i)continue;const o=S.players[j],v=p.cmd[j];
    r+=`<div class="row"><div class="who"><i class="dot" style="--c:${COLORS[o.color].c}"></i><span>${esc(o.name)}</span></div>
      <button data-act="cd" data-f="${j}" data-d="-1" aria-label="Minus 1">−</button><b class="${v>=LETHAL?'d':v>=15?'w':''}">${v}</b><button data-act="cd" data-f="${j}" data-d="1" aria-label="Plus 1">+</button></div>`;}
  return `<header><span>Commander damage taken</span><button data-act="cmdx" aria-label="Close">×</button></header><div class="rows">${r}</div>`;
}

/* ==== Acties ==== */
function bump(i,d){pend[i]+=d;clearTimeout(pendT[i]);pendT[i]=setTimeout(()=>{pend[i]=0;update(i)},1600)}
function life(i,d){S.players[i].life+=d;bump(i,d);update(i);save()}
function cmd(i,f,d){const p=S.players[i],nv=Math.max(0,p.cmd[f]+d),real=nv-p.cmd[f];if(!real)return;p.cmd[f]=nv;if(S.link){p.life-=real;bump(i,-real)}update(i);save()}

const holds=new Map();
board.addEventListener('pointerdown',e=>{
  wake();const z=e.target.closest('.zone');if(!z)return;
  const i=+z.closest('.tile').dataset.i,d=+z.dataset.z;z.classList.add('press');
  const h={i,d,z,fired:false};h.t=setTimeout(function rep(){h.fired=true;life(i,d*10);h.t=setTimeout(rep,600)},500);
  holds.set(e.pointerId,h);
});
const endHold=e=>{const h=holds.get(e.pointerId);if(!h)return;clearTimeout(h.t);h.z.classList.remove('press');if(!h.fired&&e.type==='pointerup')life(h.i,h.d);holds.delete(e.pointerId)};
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,endHold));
board.addEventListener('contextmenu',e=>e.preventDefault());

board.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const t=b.closest('.tile'),i=t?+t.dataset.i:-1,a=b.dataset.act;
  if(a==='cmd'){open.add(i);update(i)}
  else if(a==='cmdx'){open.delete(i);update(i)}
  else if(a==='cd')cmd(i,+b.dataset.f,+b.dataset.d);
  else if(a==='menu')showMenu();
  else if(a==='name')editName(i,b);
  else if(a==='n'||a==='start'||a==='dice'||a==='mana'||a==='pc')showPop(b,a);
  else if(a==='pdie')planarRoll();
  else if(a==='pcost'){S.pc.cost=0;save();renderPlane()}
  else if(a==='zoom')showZoom(b.getAttribute('src'));
  else if(a==='pcload'){PL.state='';loadPlanes()}
  else if(a==='first')pickFirst();
  else if(a==='new'){clearTimeout(sureT);
    if(!sure){sure=true;bar();sureT=setTimeout(()=>{sure=false;bar()},3000)}
    else{sure=false;S=fresh(S.n,S.start,S);open.clear();pend.fill(0);save();render()}}
});

/* ==== Naam wijzigen in het vak ==== */
function editName(i,el){
  if(el.querySelector('input'))return;
  el.innerHTML=`<input class="namein" value="${esc(S.players[i].name)}" maxlength="18" enterkeyhint="done" aria-label="Player ${i+1} name">`;
  const inp=el.firstChild;inp.focus();inp.select();
  const done=keep=>{if(!inp.isConnected)return;if(keep)S.players[i].name=inp.value.trim()||`Player ${i+1}`;save();el.textContent=S.players[i].name};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false)});
  inp.addEventListener('blur',()=>done(true));
}

  10:['<polygon points="50,3 94,44 50,97 6,44"/><path d="M6 44l44 12 44-12M50 56v41" class="ln"/>',-4],
  12:['<polygon points="50,4 96,37 78,93 22,93 4,37"/><polygon points="50,24 75,42 66,72 34,72 25,42" class="ln"/>',4],
  20:['<polygon points="50,3 93,27 93,73 50,97 7,73 7,27"/><polygon points="50,17 85,74 15,74" class="ln"/>',8]};
const dieHtml=c=>`<div class="die${c}"><div class="dw" style="--ty:8px"><svg viewBox="0 0 100 100" aria-hidden="true">${SHAPES[20][0]}</svg><b></b></div></div>`;
function showPop(b,k){
  if(!pop.hidden&&popKind===k){pop.hidden=true;return}
  popKind=k;clearTimeout(rollT);pop.classList.toggle('r180',k==='mana'&&manaRot);
  if(k==='dice')pop.innerHTML=`<div class="opts">${DICE.map(d=>`<button data-die="${d}" aria-label="${d==='munt'?'Flip a coin':'d'+d}">${d==='munt'?ico(I_COIN):'d'+d}</button>`).join('')}</div>
    <div class="roll">${dieHtml('')}<span></span>${dieHtml(' dn')}</div>`;
  else if(k==='mana')pop.innerHTML=manaHtml();
  else if(k==='pc')pop.innerHTML=pcHtml();
  else{const opts=k==='n'?(S.pc.on?[2,3,4]:[2,3,4,5,6]):[20,30,40],cur=k==='n'?S.n:S.start;
    pop.innerHTML=`<div class="opts">${opts.map(v=>`<button data-v="${v}" class="${v===cur?'on':''}">${v}</button>`).join('')}</div>`+
      (k==='start'?`<form class="custom"><input id="lifeIn" type="number" inputmode="numeric" min="1" max="9999" value="${S.start}" aria-label="Custom starting life"><button>Set</button></form>`:'')}
  pop.hidden=false;const r=b.getBoundingClientRect(),w=pop.offsetWidth;
  const h=pop.offsetHeight;
  pop.style.left=Math.min(innerWidth-w/2-8,Math.max(w/2+8,r.left+r.width/2))+'px';
  pop.style.top=Math.min(innerHeight-h/2-8,Math.max(h/2+8,r.top+r.height/2))+'px';
}
function manaHtml(){
  const row=(m,v,i)=>`<div class="mrow${v?'':' zero'}"><button data-m="${i}" data-d="-1" aria-label="${m.n||'Storm'} minus 1">−</button>
    <i class="mi">${m.s}</i><b>${v}</b>
    <button data-m="${i}" data-d="1" aria-label="${m.n||'Storm'} plus 1">+</button></div>`;
  const clr=k=>`<button data-clr="${k}" aria-label="Reset to zero">${ico(I_RESET)}</button>`;
  return `<div class="mana"><button class="turn" data-turn aria-label="Rotate 180 degrees">${ico('<path d="M4.5 12a7.5 7.5 0 0 1 13.2-4.9M19.5 12a7.5 7.5 0 0 1-13.2 4.9"/><path d="M18 3v4.5h-4.5M6 21v-4.5h4.5"/>')}</button><h3>Mana ${clr('mana')}</h3>${MANA.map((m,i)=>row(m,S.mana[i],i)).join('')}
    <h3>Storm ${clr('storm')}</h3>${row(STORM,S.storm,'s')}</div>`;
}
function roll(d){
  clearTimeout(rollT);
  pop.querySelectorAll('[data-die]').forEach(b=>b.classList.toggle('on',b.dataset.die===String(d)));
  pop.querySelector('.roll span').textContent=d==='munt'?'Coin':'d'+d;
  const[shape,ty]=SHAPES[d],red=matchMedia('(prefers-reduced-motion: reduce)').matches,dies=pop.querySelectorAll('.die'),
    out=pop.querySelectorAll('.dw b'),val=()=>d==='munt'?(Math.random()<.5?'Heads':'Tails'):1+Math.floor(Math.random()*d);
  dies.forEach(el=>{el.classList.remove('fin');const w=el.querySelector('.dw');w.className='dw'+(d==='munt'?' munt':'');
    w.style.setProperty('--ty',ty+'px');w.querySelector('svg').innerHTML=shape;void w.offsetWidth;if(!red)w.classList.add(d==='munt'?'flip':'go')});
  let k=red?0:10;
  (function tick(){const v=val();out.forEach(o=>o.textContent=v);if(k-->0)rollT=setTimeout(tick,40+(10-k)*14);else dies.forEach(e=>e.classList.add('fin'))})();
}
pop.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.die){const d=b.dataset.die;roll(d==='munt'?d:+d);return}
  if('turn' in b.dataset){manaRot=!manaRot;pop.classList.toggle('r180',manaRot);return}
  const{m,d,clr}=b.dataset;
  if(m||clr){if(clr==='mana')S.mana.fill(0);else if(clr)S.storm=0;else if(m==='s')S.storm=Math.max(0,S.storm+ +d);else S.mana[+m]=Math.max(0,S.mana[+m]+ +d);
    save();pop.innerHTML=manaHtml();return}
  const pc=b.dataset.pc;
  if(pc){
    if(pc==='on'){S.pc.on=!S.pc.on;if(S.pc.on&&S.n>4)S.n=4;open.clear()}
    else if(pc==='walk')planeswalk();
    else if(pc==='shuffle'){S.pc.deck=[];S.pc.cost=0;S.pc.last=null}
    else if(pc==='cards'){pop.hidden=true;showPlanes();return}
    save();render();pop.innerHTML=pcHtml();return}
  if(!b.dataset.v)return;
  const v=+b.dataset.v;pop.hidden=true;
  if(popKind==='n'){S.n=v;open.clear();save();render()}else setStart(v)});
pop.addEventListener('submit',e=>{e.preventDefault();const v=Math.round(+$('#lifeIn').value);if(v>0&&v<=9999){pop.hidden=true;setStart(v)}});
function setStart(v){const u=untouched();S.start=v;if(u)S.players.forEach(p=>p.life=v);save();render()}
document.addEventListener('pointerdown',e=>{if(pop.hidden||pop.contains(e.target)||e.target.closest('[data-act="n"],[data-act="start"],[data-act="dice"],[data-act="mana"],[data-act="pc"]'))return;
  pop.hidden=true;e.stopPropagation()},true);

/* ==== Wie begint ==== */
let spin=null;
function pickFirst(){
  clearTimeout(spin);const w=Math.floor(Math.random()*S.n),steps=matchMedia('(prefers-reduced-motion: reduce)').matches?0:S.n*2+w;
  const mark=(i,f)=>board.querySelectorAll('.tile').forEach(t=>{t.classList.toggle('pick',+t.dataset.i===i);t.classList.toggle('first',f&&+t.dataset.i===i)});
  (function step(k){mark(k%S.n,k>=steps);
    spin=k<steps?setTimeout(()=>step(k+1),60+k*k*1.2):setTimeout(()=>mark(-1,false),5000)})(steps?0:w);
}

/* ==== Instellingen ==== */
let sure=false,sureT=null;
function showMenu(){
  const fs=document.fullscreenEnabled;
  let pl='';for(let i=0;i<S.n;i++){const p=S.players[i];
    pl+=`<div class="pl"><input id="name-${i}" data-name="${i}" value="${esc(p.name)}" maxlength="18" aria-label="Player ${i+1} name">
      <div class="cols">${COLORS.map((c,k)=>`<button data-col="${i}:${k}" class="${p.color===k?'on':''}" style="--c:${c.c}" aria-label="${c.n}"></button>`).join('')}</div>
      <button class="artbtn" data-art="${i}" aria-label="Choose art for player ${i+1}"${okArt(p.art)?` style="background-image:url('${okArt(p.art)}')"`:''}>${okArt(p.art)?'':ico(I_IMG)}</button></div>`;}
  sheet.innerHTML=`<div class="box" role="dialog" aria-label="Settings"><h2>Settings</h2>
    ${fs?`<button class="tog" data-fs><span>Fullscreen</span><i class="sw ${document.fullscreenElement?'on':''}"></i></button>`:''}
    <div class="grp"><span class="lbl">Names and colors</span>${pl}</div>
    <div class="grp"><span class="lbl">Theme</span><div class="seg">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,t])=>`<button data-theme-set="${k}" class="${S.theme===k?'on':''}">${t}</button>`).join('')}</div></div>
    <button class="tog" data-link><span>Commander damage reduces life</span><i class="sw ${S.link?'on':''}"></i></button>
    <div class="acts"><button class="new" data-close>Done</button></div></div>`;
  sheet.hidden=false;
}
sheet.addEventListener('click',e=>{
  if(e.target===sheet){sheet.hidden=true;return}
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if('link' in ds){S.link=!S.link;save();showMenu()}
  else if(ds.themeSet){S.theme=ds.themeSet;save();applyTheme();showMenu()}
  else if(ds.pall){const on=ds.pall==='1',ids=new Set(planeFilter().map(c=>c.id));S.pc.off=on?S.pc.off.filter(x=>!ids.has(x)):[...new Set([...S.pc.off,...ids])];save();listPlanes()}
  else if('pdone' in ds){sheet.hidden=true;render()}
  else if(ds.col){const[i,k]=ds.col.split(':').map(Number);S.players[i].color=k;save();render();showMenu()}
  else if('fs' in ds){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen({navigationUI:'hide'}))?.catch(()=>{})}
  else if('close' in ds)sheet.hidden=true;
  else if(ds.art)showArt(+ds.art);
  else if(ds.pick){const r=found[+ds.pick],p=S.players[artFor];if(!r)return;p.art=r.art;p.artist=r.artist;save();keepArt(r.art);render();showMenu()}
  else if('noart' in ds){const p=S.players[artFor];delete p.art;delete p.artist;save();render();showMenu()}
  else if('back' in ds)showMenu();
});

/* ==== Art zoeken via Scryfall ==== */
let artFor=0,found=[],searchN=0;
function showArt(i){
  artFor=i;found=[];const p=S.players[i];
  sheet.innerHTML=`<div class="box wide" role="dialog" aria-label="Choose art"><h2>Art for ${esc(p.name)}</h2>
    <form class="srch"><input id="q" type="search" placeholder="Card name, e.g. Atraxa" autocomplete="off" enterkeyhint="search" aria-label="Card name"><button>Search</button></form>
    <div class="res" id="res"></div>
    <div class="acts">${okArt(p.art)?'<button data-noart>Remove art</button>':''}<button data-back>Back</button></div></div>`;
  sheet.hidden=false;$('#q').focus();
}
sheet.addEventListener('submit',async e=>{
  e.preventDefault();if(!$('#q'))return;const q=$('#q').value.trim(),res=$('#res'),n=++searchN;if(!q)return;
  res.innerHTML='<p class="msg">Searching…</p>';$('#q').blur();
  try{
    const r=await fetch('https://api.scryfall.com/cards/search?unique=art&order=released&dir=desc&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});
    if(n!==searchN)return;
    if(r.status===404){res.innerHTML='<p class="msg">No cards found. Check the spelling or try part of the name.</p>';return}
    if(!r.ok)throw r.status;
    const js=await r.json();found=[];
    for(const c of js.data)for(const f of c.image_uris?[c]:c.card_faces||[]){const a=okArt(f.image_uris?.art_crop);
      if(a)found.push({art:a,name:f.name||c.name,set:(c.set||'').toUpperCase(),artist:f.artist||c.artist||''})}
    found=found.slice(0,60);const cur=S.players[artFor].art;
    res.innerHTML=found.length?found.map((f,k)=>`<button data-pick="${k}" class="${f.art===cur?'on':''}"><img src="${f.art}" alt="${esc(f.name)}" loading="lazy"><small>${esc(f.name)} · ${esc(f.set)}</small></button>`).join('')
      :'<p class="msg">No artwork found for this card.</p>';
  }catch(err){if(n===searchN)res.innerHTML='<p class="msg">Search failed. Check the internet connection and try again.</p>'}
});
/* gekozen art bewaren voor offline gebruik (service worker leest deze cache) */
function keepArt(u){try{caches.open('lt-art').then(c=>fetch(u,{mode:'no-cors'}).then(r=>c.put(u,r))).catch(()=>{})}catch(e){}}
sheet.addEventListener('input',e=>{if(e.target.id==='pf')return listPlanes();const i=e.target.dataset.name;if(i==null)return;S.players[+i].name=e.target.value||`Player ${+i+1}`;save();update(+i)});
sheet.addEventListener('change',e=>{const id=e.target.dataset.pid;if(!id)return;const o=new Set(S.pc.off);e.target.checked?o.delete(id):o.add(id);S.pc.off=[...o];save();planeCount()});

/* ==== Planechase ==== */
const PKEY='lt-planes-v2';let PL={cards:null,map:null,state:''},pRolling=false;
async function loadPlanes(){
  if(PL.cards||PL.state==='busy')return;
  /* test- en grapkaarten (Scryfall set_type 'funny', bijv. Black Lotus Unknown: MagicCon Chicago, Black Lotus Lounge) één keer standaard uit */
  const use=cards=>{PL.cards=cards;PL.map=new Map(cards.map(c=>[c.id,c]));PL.state='';
    if(!S.pc.defs){S.pc.off=[...new Set([...S.pc.off,...cards.filter(c=>c.fun).map(c=>c.id)])];S.pc.defs=1;S.pc.deck=[];save()}};
  try{const c=JSON.parse(localStorage.getItem(PKEY));if(c?.cards?.length&&Date.now()-c.t<30*864e5){use(c.cards);renderPlane();return}}catch(e){}
  PL.state='busy';renderPlane();
  try{
    let url='https://api.scryfall.com/cards/search?q=layout%3Aplanar&unique=cards&order=name';const out=[];
    while(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw r.status;const j=await r.json();
      for(const c of j.data){const img=okArt(c.image_uris?.large);if(img)out.push({id:c.id,name:c.name,set:(c.set||'').toUpperCase(),ph:/Phenomenon/.test(c.type_line),fun:c.set_type==='funny',img})}
      url=j.has_more&&/^https:\/\/api\.scryfall\.com\//.test(j.next_page)?j.next_page:null;if(url)await new Promise(r=>setTimeout(r,120))}
    use(out);try{localStorage.setItem(PKEY,JSON.stringify({t:Date.now(),cards:out}))}catch(e){}
  }catch(e){PL.state='err'}
  renderPlane();if(!sheet.hidden&&$('#plist'))listPlanes();
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function curPlane(){
  if(!PL.cards)return null;const on=PL.cards.filter(c=>!S.pc.off.includes(c.id));if(!on.length)return null;
  const ids=new Set(on.map(c=>c.id)),d=S.pc.deck;
  if(!d.length||d.length!==on.length||d.some(x=>!ids.has(x))){S.pc.deck=shuffle(on.map(c=>c.id));S.pc.pos=0;save()}
  return PL.map.get(S.pc.deck[S.pc.pos%S.pc.deck.length]);
}
const faceHtml=r=>r==='pw'?PW_FACE:r==='chaos'?CHAOS_FACE:r==='blank'?'':ico(I_DIE);
function renderPlane(){
  const t=board.querySelector('.plane');if(!t)return;const c=curPlane();
  if(c){keepArt(c.img);const nx=PL.map.get(S.pc.deck[(S.pc.pos+1)%S.pc.deck.length]);if(nx)keepArt(nx.img)}
  t.innerHTML=`<div class="pimg">${c?`<img src="${c.img}" alt="${esc(c.name)}" data-act="zoom">`
      :`<p>${PL.state==='err'?'Could not load the planes. <button data-act="pcload">Try again</button>':PL.cards?'No planes selected.':'Loading planes…'}</p>`}</div>
    <div class="pbar"><button class="pdie${S.pc.last?' r-'+S.pc.last:''}" data-act="pdie" aria-label="Roll the planar die"><span class="face">${faceHtml(S.pc.last)}</span></button>
      ${S.pc.cost?`<button class="pcost" data-act="pcost" aria-label="Reset roll cost">${ico(I_RESET)}<b>${S.pc.cost}</b></button>`:''}</div>`;
}
/* planar die: 1x planeswalk, 1x chaos, 4x leeg; elke extra worp in dezelfde beurt kost 1 mana meer */
function planarRoll(){
  if(pRolling||!curPlane())return;pRolling=true;
  const n=Math.floor(Math.random()*6),res=n===0?'pw':n===1?'chaos':'blank',red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* grote rollende dobbelsteen in een venster; blijft staan tot erop getikt wordt */
  const ov=$('#proll');ov.innerHTML='<div class="bigdie"><span class="face"></span></div><b class="lbl"></b>';ov.hidden=false;
  const big=ov.querySelector('.bigdie'),f=big.querySelector('.face');if(!red)f.classList.add('go');
  let k=red?0:11;
  (function tick(){
    if(k-->0){f.innerHTML=faceHtml(['pw','chaos','blank'][Math.floor(Math.random()*3)]);setTimeout(tick,45+(11-k)*14);return}
    f.innerHTML=faceHtml(res);big.classList.add('r-'+res);ov.querySelector('.lbl').textContent=res==='pw'?'Planeswalk':res==='chaos'?'Chaos':'Nothing happens';
    S.pc.last=res;S.pc.cost++;save();pRolling=false;renderPlane();
  })();
}
function closeRoll(){const ov=$('#proll');if(ov.hidden||pRolling)return;ov.hidden=true;if(S.pc.last==='pw')planeswalk()}
$('#proll').addEventListener('click',closeRoll);
function planeswalk(){if(!curPlane())return;S.pc.pos=(S.pc.pos+1)%S.pc.deck.length;save();renderPlane()}
function pcHtml(){
  const tot=PL.cards?.length,on=PL.cards?PL.cards.filter(c=>!S.pc.off.includes(c.id)).length:0;
  return `<div class="pcm"><button class="tog" data-pc="on"><span>Planechase</span><i class="sw ${S.pc.on?'on':''}"></i></button>
    ${S.pc.on?`<div class="pcrow"><button data-pc="walk">Planeswalk</button><button data-pc="shuffle">Shuffle</button></div>`:''}
    <button data-pc="cards">Choose planes${tot?` (${on}/${tot})`:''}</button></div>`;
}
const planeFilter=()=>{const q=($('#pf')?.value||'').trim().toLowerCase();return(PL.cards||[]).filter(c=>!q||c.name.toLowerCase().includes(q)||c.set.toLowerCase()===q)};
function showPlanes(){
  sheet.innerHTML=`<div class="box wide" role="dialog" aria-label="Choose planes"><h2>Planes <small id="pcount"></small></h2>
    <div class="srch"><input id="pf" type="search" placeholder="Filter by name or set code" autocomplete="off" aria-label="Filter planes"></div>
    <div class="acts"><button data-pall="1">All on</button><button data-pall="0">All off</button></div>
    <div class="plist" id="plist"></div>
    <div class="acts"><button class="new" data-pdone>Done</button></div></div>`;
  sheet.hidden=false;loadPlanes();listPlanes();
}
function listPlanes(){
  const l=$('#plist');if(!l)return;
  if(!PL.cards){l.innerHTML=`<p class="msg">${PL.state==='err'?'Could not load the planes. Check the internet connection.':'Loading planes…'}</p>`;return}
  const off=new Set(S.pc.off);
  l.innerHTML=planeFilter().map(c=>`<label class="prow"><input type="checkbox" data-pid="${c.id}"${off.has(c.id)?'':' checked'}><span>${esc(c.name)}</span><small>${esc(c.set)}${c.ph?' · Phenomenon':''}</small></label>`).join('')||'<p class="msg">No planes match.</p>';
  planeCount();
}
function planeCount(){const e=$('#pcount');if(e&&PL.cards)e.textContent=`${PL.cards.length-S.pc.off.length}/${PL.cards.length}`}
function showZoom(src){const z=$('#zoom');z.innerHTML=`<img src="${src}" alt="">`;z.hidden=false}
$('#zoom').addEventListener('click',()=>$('#zoom').hidden=true);

/* ==== Scherm aan houden ==== */
let lock=null;
async function wake(){if(lock||!navigator.wakeLock)return;try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
